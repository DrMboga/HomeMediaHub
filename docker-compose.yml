services:

  # ── Custom PostgreSQL with pgvector ────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: homemediahub_db
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - homemediahub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Immich PostgreSQL (isolated — not accessed by custom services) ──────────
  immich-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${IMMICH_DB_USER}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: immich
    volumes:
      - ${DATA_DIR}/immich-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - homemediahub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IMMICH_DB_USER} -d immich"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Immich only) ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - homemediahub

  # ── Immich server (iPhone backup endpoint — no Immich UI used) ────────────
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    environment:
      DB_HOSTNAME: immich-postgres
      DB_PORT: 5432
      DB_DATABASE_NAME: immich
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      REDIS_HOSTNAME: redis
      IMMICH_MEDIA_LOCATION: /usr/src/app/upload
    volumes:
      - ${PHOTO_DIR}/iPhone:/usr/src/app/upload
    ports:
      - "2283:2283"
    networks:
      - homemediahub
    depends_on:
      immich-postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── RabbitMQ 4 (message broker — pipeline orchestration) ──────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ${DATA_DIR}/rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "15672:15672"
      - "127.0.0.1:15692:15692"
    networks:
      - homemediahub
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── .NET 10 API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./src
      dockerfile: Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=homemediahub_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Keepalive=30;Connection Idle Lifetime=300"
      Seed__MikePassword: ${MIKE_PASSWORD}
      Seed__BadgerPassword: ${BADGER_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      # Photo of the Day. Off unless POTD_ENABLED is literally true — stage must never post to
      # the family channel. :- (not -) so a variable present but blank still falls back.
      Potd__Enabled: ${POTD_ENABLED:-false}
      Potd__BotToken: ${POTD_BOT_TOKEN:-}
      Potd__ChatId: ${POTD_CHAT_ID:-}
      Potd__TimeZone: ${POTD_TIMEZONE:-Europe/Berlin}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - ${PHOTO_DIR}:/photo
      - ${THUMBNAILS_DIR}:/thumbnails
      - ${VIDEO_CACHE_DIR}:/video-cache
      - ${DISPLAY_CACHE_DIR}:/display-cache
      - ${WORK_DIR}:/shared-temp
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - homemediahub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── GeoService PostgreSQL (geoservice_db — address cache) ───────────────
  geoservice-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: geoservice
      POSTGRES_PASSWORD: ${GEOSERVICE_DB_PASSWORD}
      POSTGRES_DB: geoservice_db
    volumes:
      - ${DATA_DIR}/geoservice-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - homemediahub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoservice -d geoservice_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── GeoService (.NET 10 — reverse geocoding cache) ────────────────────────
  geoservice:
    build:
      context: ./src
      dockerfile: GeoService/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__GeoDb: "Host=geoservice-postgres;Port=5432;Database=geoservice_db;Username=geoservice;Password=${GEOSERVICE_DB_PASSWORD};Keepalive=30;Connection Idle Lifetime=300"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      ASPNETCORE_URLS: http://+:8001
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - homemediahub
    depends_on:
      geoservice-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Python AI sidecar (YOLOv8n + CLIP — baked in at build) ───────────────
  ai-sidecar:
    build:
      context: src/AiSidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    volumes:
      - ${PHOTO_DIR}:/photo:ro
      - ${WORK_DIR}:/shared-temp:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - homemediahub
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ── .NET 10 MediaWorker (ingest consumers, enrichment saga, file processing) ─
  media-worker:
    build:
      context: ./src
      dockerfile: MediaWorker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=homemediahub_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Keepalive=30;Connection Idle Lifetime=300"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      DOTNET_ENVIRONMENT: Production
    volumes:
      - ${PHOTO_DIR}:/photo:ro
      - ${THUMBNAILS_DIR}:/thumbnails
      - ${WORK_DIR}:/shared-temp
    networks:
      - homemediahub
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

  # ── React frontend (Phase 6: production Vite build) ─────────────────────
  frontend:
    build:
      context: src/Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - homemediahub

  # ── NGINX reverse proxy (single public ingress on :80) ────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${THUMBNAILS_DIR}:/thumbs:ro
    ports:
      - "80:80"
    networks:
      - homemediahub
    depends_on:
      - frontend
      - api
      - immich-server

  # ── Prometheus (scrapes api/media-worker/geoservice/ai-sidecar/rabbitmq) ──
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR}/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - homemediahub
    depends_on:
      - api
      - media-worker
      - geoservice
      - ai-sidecar

  # ── Grafana (pipeline dashboard) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_DIR}/grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - homemediahub
    depends_on:
      - prometheus

networks:
  homemediahub:
    driver: bridge
