events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker's internal DNS — resolves service names at request time, not startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend  { server frontend:80; }
    upstream api       { server api:8080; }

    server {
        listen 80;

        # .NET REST API
        location /api/ {
            proxy_pass       http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # /media/{id}/stream and /display convert on demand. The 60s default cut the
            # connection mid-transcode, so the browser gave up even when ffmpeg was working.
            # H.264 .MOV now remuxes in seconds; this covers the re-encode cases that remain.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Immich mobile endpoint (variable proxy_pass defers DNS to request time)
        location /immich/ {
            set $immich_upstream http://immich-server:2283;
            proxy_pass       $immich_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Thumbnail internal redirect (X-Accel-Redirect from .NET API)
        location /thumbs/ {
            internal;
            alias /thumbs/;
        }

        # React frontend (catch-all)
        location / {
            proxy_pass       http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
