events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream frontend  { server frontend:80; }
    upstream api       { server api:8080; }
    upstream n8n       { server n8n:5678; }
    upstream immich    { server immich-server:2283; }

    server {
        listen 80;

        # n8n admin UI — restricted to LAN only
        location /n8n/ {
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;

            proxy_pass         http://n8n/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # .NET REST API
        location /api/ {
            proxy_pass       http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Immich mobile endpoint
        location /immich/ {
            proxy_pass       http://immich/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Thumbnail internal redirect (X-Accel-Redirect from .NET API)
        location /thumbs/ {
            internal;
            alias /thumbs/;
        }

        # React frontend (catch-all)
        location / {
            proxy_pass       http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
