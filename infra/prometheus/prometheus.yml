global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: media-worker
    static_configs:
      - targets: ["media-worker:9090"]

  - job_name: geoservice
    static_configs:
      - targets: ["geoservice:8001"]

  - job_name: ai-sidecar
    static_configs:
      - targets: ["ai-sidecar:8001"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Per-queue depth — the pipeline's progress bar during the multi-day archive import.
  #
  # rabbitmq_prometheus defaults to prometheus.return_per_object_metrics = false, so the
  # plain /metrics endpoint publishes rabbitmq_queue_messages_ready *aggregated*, with no
  # `queue` label at all. The dashboard's per-queue panels therefore matched nothing.
  #
  # /metrics/detailed returns per-object series for the families named here. Scoped to
  # queue_coarse_metrics deliberately, rather than flipping return_per_object_metrics
  # globally, which would also emit per-object series for every connection and channel.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
