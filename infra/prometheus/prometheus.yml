global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: media-worker
    static_configs:
      - targets: ["media-worker:9090"]

  - job_name: geoservice
    static_configs:
      - targets: ["geoservice:8001"]

  - job_name: ai-sidecar
    static_configs:
      - targets: ["ai-sidecar:8001"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
